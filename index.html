<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remix Dice Pool</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, 'Times New Roman', serif;
            color: #3d2b1f;
            background-color: #b8935a;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px),
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,0,0,0.02) 2px, rgba(0,0,0,0.02) 4px);
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 2rem 1rem;
            width: min(520px, 96vw);
        }

        .title-block {
            text-align: center;
        }

        h1 {
            font-size: 2.4rem;
            color: #f5e6c8;
            letter-spacing: 0.06em;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.4);
        }

        .subtitle {
            font-size: 0.95rem;
            color: rgba(245,230,200,0.75);
            font-style: italic;
            margin-top: 0.25rem;
        }

        .nav-cards {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .nav-card {
            display: block;
            background: #f5e6c8;
            background-image: radial-gradient(ellipse at 20% 30%, rgba(255,255,255,0.18) 0%, transparent 60%);
            border: 3px solid #8b5e3c;
            border-radius: 12px;
            padding: 1.5rem 2rem;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 5px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.4);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .nav-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.38), inset 0 1px 0 rgba(255,255,255,0.4);
        }

        .nav-card:active {
            transform: translateY(1px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.28);
        }

        .nav-card-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: #5c3317;
            margin-bottom: 0.3rem;
        }

        .nav-card-desc {
            font-size: 0.88rem;
            color: #7a5c40;
            font-style: italic;
            line-height: 1.4;
        }

        .nav-card-arrow {
            float: right;
            font-size: 1.5rem;
            color: #8b5e3c;
            margin-top: -0.1rem;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="title-block">
        <h1>Remix Dice Pool</h1>
        <p class="subtitle">High Five System</p>
    </div>

    <div class="nav-cards">
        <a class="nav-card" href="dice-pool.html">
            <span class="nav-card-arrow">&#8594;</span>
            <div class="nav-card-title">Dice Roller</div>
            <div class="nav-card-desc">Roll a pool of 2–10 dice. See results as numbers or pips, with hit scoring and fumble detection.</div>
        </a>

        <a class="nav-card" href="dice-pool-stats.html">
            <span class="nav-card-arrow">&#8594;</span>
            <div class="nav-card-title">Dev Stats</div>
            <div class="nav-card-desc">Run thousands of rolls at once. Compare average hits, highest rolls, and fumble rates across pool sizes.</div>
        </a>
    </div>
</div>
</body>
</html>
